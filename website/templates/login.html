<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Log In - Plan Tomorrow</title>
</head>

<body class="auth-body">

    <div class="auth-container">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to manage your tasks</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="auth-alert {% if category == 'error' %}alert-error{% else %}alert-info{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" class="auth-form">
            <div class="auth-field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required
                    autocomplete="email" />
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                    autocomplete="current-password" />
            </div>

            <button type="submit" class="auth-btn">Log In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign Up</a>
        </p>
    </div>

</body>

</html>
