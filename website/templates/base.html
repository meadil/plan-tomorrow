<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{% block title %}Plan Tomorrow{% endblock %}</title>
</head>

<body>

    <div class="date-display">
        <h2>{{ current_time.strftime("%B '%y") }}</h2>
        <h3>{{ current_time.strftime("%A") }}</h3>
    </div>

    <div class="week-bar" id="weekBar">
        <div class="day-pill" data-day="0">
            <span class="day-name">SUN</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="1">
            <span class="day-name">MON</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="2">
            <span class="day-name">TUE</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="3">
            <span class="day-name">WED</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="4">
            <span class="day-name">THU</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="5">
            <span class="day-name">FRI</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="6">
            <span class="day-name">SAT</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
    </div>

    <main class="content-container">
        {% block content %}
        <div id="taskList" class="task-list">
            <div class="task-item">
                <span class="task-checkbox"></span>
                <span class="task-title">Example task item</span>
            </div>
        </div>
        {% endblock %}
    </main>

    <div class="bottom-bar-container">
        <form id="addTaskForm" class="task-input-form" onsubmit="return false;">
            <input type="text" id="taskInput" class="task-input" placeholder="Add a new task..." autocomplete="off"
                required />

            <div class="time-inputs-wrapper">
                <input type="time" id="startTimeInput" class="time-picker" title="Start Time" />
                <span class="time-dash">-</span>
                <input type="time" id="endTimeInput" class="time-picker" title="End Time" />
            </div>

            <button type="submit" id="addTaskBtn" class="add-task-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </form>
    </div>

    <div id="modalOverlay" class="modal-overlay"></div>

    <div id="editModal" class="edit-modal">
        <div class="modal-header">
            <h3>Edit Task</h3>
            <button type="button" id="closeModalBtn" class="close-modal-btn">&times;</button>
        </div>

        <form id="editTaskForm">
            <input type="hidden" id="editTaskId" />

            <div class="form-group">
                <label for="editTaskTitle">Task Title</label>
                <input type="text" id="editTaskTitle" class="edit-text-input" placeholder="Task name..." required />
            </div>

            <div class="time-range-group">
                <div class="form-group">
                    <label for="editStartTime">Start Time</label>
                    <input type="time" id="editStartTime" class="edit-time-input" />
                </div>
                <div class="form-group">
                    <label for="editEndTime">End Time</label>
                    <input type="time" id="editEndTime" class="edit-time-input" />
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" id="deleteTaskBtn" class="delete-task-btn">Delete</button>
                <button type="submit" class="save-task-btn">Save Changes</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date();
            const currentDayOfWeek = today.getDay();

            let selectedDateStr = formatDateToISO(today);

            function formatDateToISO(d) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            const sundayDate = new Date(today);
            sundayDate.setDate(today.getDate() - currentDayOfWeek);

            const dayPills = document.querySelectorAll(".day-pill");

            dayPills.forEach((pill) => {
                const dayIndex = parseInt(pill.getAttribute("data-day"));
                const pillDate = new Date(sundayDate);
                pillDate.setDate(sundayDate.getDate() + dayIndex);

                const isoDate = formatDateToISO(pillDate);
                pill.setAttribute("data-date", isoDate);
                pill.querySelector(".day-number").textContent = pillDate.getDate();

                if (dayIndex === currentDayOfWeek) {
                    pill.classList.add("active");
                    pill.classList.add("today");
                } else {
                    pill.classList.remove("active");
                }

                pill.addEventListener("click", () => {
                    dayPills.forEach(p => p.classList.remove("active"));
                    pill.classList.add("active");

                    selectedDateStr = pill.getAttribute("data-date");
                    fetchTasks(selectedDateStr);
                });
            });

            // Fetch & render tasks
            async function fetchTasks(dateStr) {
                const taskList = document.getElementById("taskList");
                taskList.innerHTML = `<p style="color:#8a8d98; font-size: 0.9rem; text-align:center; margin-top:20px;"></p>`; /* i don't like loading, don't add it here */

                try {
                    const res = await fetch(`/get-tasks?date=${dateStr}`);
                    const tasks = await res.json();

                    taskList.innerHTML = "";
                    if (tasks.length === 0) {
                        taskList.innerHTML = `<p style="color:#b0b4b8; font-size:0.9rem; text-align:center; margin-top:20px;">No tasks here.</p>`;
                        return;
                    }

                    tasks.forEach(task => renderTaskItem(task));
                } catch (err) {
                    console.error("Failed to fetch tasks:", err);
                }
            }

            // Render single task item
            function renderTaskItem(task) {
                const taskList = document.getElementById("taskList");

                if (taskList.querySelector("p")) {
                    taskList.innerHTML = "";
                }

                const item = document.createElement("div");
                item.className = `task-item ${task.is_completed ? "completed" : ""}`;
                item.setAttribute("data-id", task.id);
                item.style.cursor = "pointer";

                let timeString = "";
                if (task.start_time && task.end_time) {
                    timeString = `${task.start_time} - ${task.end_time}`;
                } else if (task.start_time) {
                    timeString = task.start_time;
                }

                item.innerHTML = `
                    <span class="task-checkbox"></span>
                    <span class="task-title" style="${task.is_completed ? "text-decoration: line-through; color: #a0a4ac;" : ""}">${task.title}</span>
                    ${timeString ? `<span class="task-time">${timeString}</span>` : ""}
                `;

                // Toggle completion (stopPropagation so modal doesn't open)
                item.querySelector(".task-checkbox").addEventListener("click", async (e) => {
                    e.stopPropagation();
                    try {
                        const res = await fetch(`/toggle-task/${task.id}`, { method: "POST" });
                        const data = await res.json();

                        const titleSpan = item.querySelector(".task-title");
                        if (data.is_completed) {
                            titleSpan.style.textDecoration = "line-through";
                            titleSpan.style.color = "#a0a4ac";
                        } else {
                            titleSpan.style.textDecoration = "none";
                            titleSpan.style.color = "#1c1c1e";
                        }
                    } catch (err) {
                        console.error("Failed to toggle task:", err);
                    }
                });

                // Click task item to open Edit Bottom Sheet Drawer
                item.addEventListener("click", () => {
                    openEditModal(task);
                });

                taskList.appendChild(item);
            }

            // --- EDIT MODAL LOGIC ---
            const modalOverlay = document.getElementById("modalOverlay");
            const editModal = document.getElementById("editModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const editTaskForm = document.getElementById("editTaskForm");
            const editTaskId = document.getElementById("editTaskId");
            const editTaskTitle = document.getElementById("editTaskTitle");
            const editStartTime = document.getElementById("editStartTime");
            const editEndTime = document.getElementById("editEndTime");
            const deleteTaskBtn = document.getElementById("deleteTaskBtn");

            function openEditModal(task) {
                editTaskId.value = task.id;
                editTaskTitle.value = task.title;
                editStartTime.value = task.raw_start_time || "";
                editEndTime.value = task.raw_end_time || "";

                modalOverlay.classList.add("active");
                editModal.classList.add("active");
            }

            function closeEditModal() {
                modalOverlay.classList.remove("active");
                editModal.classList.remove("active");
            }

            closeModalBtn.addEventListener("click", closeEditModal);
            modalOverlay.addEventListener("click", closeEditModal);

            // Save changes
            editTaskForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const taskId = editTaskId.value;

                try {
                    const res = await fetch(`/edit-task/${taskId}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            title: editTaskTitle.value.trim(),
                            start_time: editStartTime.value || null,
                            end_time: editEndTime.value || null
                        })
                    });

                    if (res.ok) {
                        closeEditModal();
                        fetchTasks(selectedDateStr);
                    }
                } catch (err) {
                    console.error("Failed to edit task:", err);
                }
            });

            // Delete task
            deleteTaskBtn.addEventListener("click", async () => {
                const taskId = editTaskId.value;
                if (!taskId) return;

                try {
                    const res = await fetch(`/delete-task/${taskId}`, { method: "POST" });
                    if (res.ok) {
                        closeEditModal();
                        fetchTasks(selectedDateStr);
                    }
                } catch (err) {
                    console.error("Failed to delete task:", err);
                }
            });

            // --- ADD TASK FORM HANDLER ---
            const addForm = document.getElementById("addTaskForm");
            const taskInput = document.getElementById("taskInput");
            const startTimeInput = document.getElementById("startTimeInput");
            const endTimeInput = document.getElementById("endTimeInput");

            addForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const title = taskInput.value.trim();
                if (!title) return;

                try {
                    const res = await fetch("/add-task", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            title: title,
                            date: selectedDateStr,
                            start_time: startTimeInput.value || null,
                            end_time: endTimeInput.value || null
                        })
                    });

                    if (res.ok) {
                        fetchTasks(selectedDateStr);
                        taskInput.value = "";
                        startTimeInput.value = "";
                        endTimeInput.value = "";
                    }
                } catch (err) {
                    console.error("Failed to add task:", err);
                }
            });

            // Initial fetch
            fetchTasks(selectedDateStr);
        });
    </script>

</body>

</html>
