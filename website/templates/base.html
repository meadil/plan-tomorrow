<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{% block title %}Plan Tomorrow{% endblock %}</title>
</head>

<body>

    <header class="header-container">
        <div class="date-display">
            <h2>{{ current_time.strftime("%B '%y") }}</h2>
            <h3>{{ current_time.strftime("%A") }}</h3>
        </div>
    </header>

    <div class="week-bar" id="weekBar">
        <div class="day-pill" data-day="0">
            <span class="day-name">SUN</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="1">
            <span class="day-name">MON</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="2">
            <span class="day-name">TUE</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="3">
            <span class="day-name">WED</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="4">
            <span class="day-name">THU</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="5">
            <span class="day-name">FRI</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
        <div class="day-pill" data-day="6">
            <span class="day-name">SAT</span>
            <span class="day-number"></span>
            <span class="day-dot"></span>
        </div>
    </div>

    <main class="content-container">
        {% block content %}{% endblock %}
    </main>

    <div class="bottom-bar-container">
        <form id="addTaskForm" class="task-input-form" onsubmit="return false;">
            <input type="text" id="taskInput" class="task-input" placeholder="Add a new task..." autocomplete="off"
                required />

            <div class="time-inputs-wrapper">
                <input type="time" id="startTimeInput" class="time-picker" title="Start Time" />
                <span class="time-dash">-</span>
                <input type="time" id="endTimeInput" class="time-picker" title="End Time" />
            </div>

            <button type="submit" id="addTaskBtn" class="add-task-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </form>
    </div>

    <div id="editModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Edit Task</h3>
            <input type="text" id="editTitleInput" class="modal-input" placeholder="Task title..." />
            <div class="modal-time-row">
                <label>Time:</label>
                <input type="time" id="editStartInput" class="time-picker" />
                <span>-</span>
                <input type="time" id="editEndInput" class="time-picker" />
            </div>
            <div class="modal-actions">
                <button type="button" id="deleteTaskBtn" class="btn-danger">Delete</button>
                <button type="button" id="cancelEditBtn" class="btn-secondary">Cancel</button>
                <button type="button" id="saveEditBtn" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date();
            const currentDayOfWeek = today.getDay();
            let selectedDateStr = formatDateToISO(today);
            let activeEditingTaskId = null;

            function formatDateToISO(d) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            const sundayDate = new Date(today);
            sundayDate.setDate(today.getDate() - currentDayOfWeek);

            const dayPills = document.querySelectorAll(".day-pill");
            dayPills.forEach((pill) => {
                const dayIndex = parseInt(pill.getAttribute("data-day"));
                const pillDate = new Date(sundayDate);
                pillDate.setDate(sundayDate.getDate() + dayIndex);

                const isoDate = formatDateToISO(pillDate);
                pill.setAttribute("data-date", isoDate);
                pill.querySelector(".day-number").textContent = pillDate.getDate();

                if (dayIndex === currentDayOfWeek) {
                    pill.classList.add("active", "today");
                } else {
                    pill.classList.remove("active");
                }

                pill.addEventListener("click", () => {
                    dayPills.forEach(p => p.classList.remove("active"));
                    pill.classList.add("active");
                    selectedDateStr = pill.getAttribute("data-date");
                    fetchTasks(selectedDateStr);
                });
            });

            async function fetchTasks(dateStr) {
                const taskList = document.getElementById("taskList");
                if (!taskList) return;

                try {
                    const res = await fetch(`/get-tasks?date=${dateStr}`);
                    if (!res.ok) throw new Error("Failed to load tasks");
                    const tasks = await res.json();

                    taskList.innerHTML = "";
                    if (!tasks || tasks.length === 0) {
                        taskList.innerHTML = `<p class="empty-state">No tasks here.</p>`;
                        return;
                    }

                    tasks.forEach(task => renderTaskItem(task));
                } catch (err) {
                    taskList.innerHTML = `<p class="empty-state">No tasks here.</p>`;
                }
            }

            function renderTaskItem(task) {
                const taskList = document.getElementById("taskList");
                const emptyMsg = taskList.querySelector(".empty-state");
                if (emptyMsg) taskList.innerHTML = "";

                const item = document.createElement("div");
                item.className = `task-item ${task.is_completed ? "completed" : ""}`;
                item.setAttribute("data-id", task.id);

                let timeString = "";
                if (task.start_time && task.end_time) {
                    timeString = `${task.start_time} - ${task.end_time}`;
                } else if (task.start_time) {
                    timeString = task.start_time;
                }

                item.innerHTML = `
                    <span class="task-checkbox"></span>
                    <span class="task-title" style="${task.is_completed ? "text-decoration: line-through; color: #a0a4ac;" : ""}">${task.title}</span>
                    ${timeString ? `<span class="task-time">${timeString}</span>` : ""}
                `;

                // Checkbox Toggle
                item.querySelector(".task-checkbox").addEventListener("click", async (e) => {
                    e.stopPropagation();
                    try {
                        const res = await fetch(`/toggle-task/${task.id}`, { method: "POST" });
                        const data = await res.json();
                        const titleSpan = item.querySelector(".task-title");
                        titleSpan.style.textDecoration = data.is_completed ? "line-through" : "none";
                        titleSpan.style.color = data.is_completed ? "#a0a4ac" : "#1c1c1e";
                    } catch (err) {
                        console.error("Failed to toggle task:", err);
                    }
                });

                // Tap Task to Edit
                item.addEventListener("click", () => {
                    activeEditingTaskId = task.id;
                    document.getElementById("editTitleInput").value = task.title;
                    document.getElementById("editStartInput").value = task.raw_start || "";
                    document.getElementById("editEndInput").value = task.raw_end || "";
                    document.getElementById("editModal").classList.remove("hidden");
                });

                taskList.appendChild(item);
            }

            // Edit Modal Handlers
            document.getElementById("cancelEditBtn").addEventListener("click", () => {
                document.getElementById("editModal").classList.add("hidden");
            });

            document.getElementById("saveEditBtn").addEventListener("click", async () => {
                if (!activeEditingTaskId) return;

                const title = document.getElementById("editTitleInput").value.trim();
                const startTime = document.getElementById("editStartInput").value;
                const endTime = document.getElementById("editEndInput").value;

                if (!title) return;

                try {
                    const res = await fetch(`/edit-task/${activeEditingTaskId}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ title, start_time: startTime, end_time: endTime })
                    });
                    if (res.ok) {
                        document.getElementById("editModal").classList.add("hidden");
                        fetchTasks(selectedDateStr);
                    }
                } catch (err) {
                    console.error("Failed to edit task:", err);
                }
            });

            document.getElementById("deleteTaskBtn").addEventListener("click", async () => {
                if (!activeEditingTaskId) return;
                try {
                    const res = await fetch(`/delete-task/${activeEditingTaskId}`, { method: "DELETE" });
                    if (res.ok) {
                        document.getElementById("editModal").classList.add("hidden");
                        fetchTasks(selectedDateStr);
                    }
                } catch (err) {
                    console.error("Failed to delete task:", err);
                }
            });

            // Add Form Submission
            const addForm = document.getElementById("addTaskForm");
            addForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const taskInput = document.getElementById("taskInput");
                const startTimeInput = document.getElementById("startTimeInput");
                const endTimeInput = document.getElementById("endTimeInput");

                const title = taskInput.value.trim();
                if (!title) return;

                try {
                    const res = await fetch("/add-task", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            title: title,
                            date: selectedDateStr,
                            start_time: startTimeInput.value || null,
                            end_time: endTimeInput.value || null
                        })
                    });

                    if (res.ok) {
                        fetchTasks(selectedDateStr);
                        taskInput.value = "";
                        startTimeInput.value = "";
                        endTimeInput.value = "";
                    }
                } catch (err) {
                    console.error("Failed to add task:", err);
                }
            });

            fetchTasks(selectedDateStr);
        });
    </script>
</body>

</html>
